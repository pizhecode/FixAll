
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>万物可修 · 家庭维修知识库</title>
<link rel="stylesheet" href="./styles.css">
<script src="./db.js"></script>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">修</span>
    <div class="brand-text">
      <strong>万物可修</strong>
      <small>家庭维修知识库</small>
    </div>
  </div>

  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input id="searchInput" type="search" placeholder="搜索故障现象、设备、零件…  例如：不制冷 / 漏水 / 跳闸" autocomplete="off">
    <kbd class="search-kbd">/</kbd>
  </div>

  <nav class="modes" id="modeNav">
    <button class="mode-btn active" data-mode="browse">浏览</button>
    <button class="mode-btn" data-mode="diagrams">图解速查 <em id="dgmCount">0</em></button>
    <button class="mode-btn" data-mode="diag">自诊向导</button>
    <button class="mode-btn" data-mode="fav">收藏 <em id="favCount">0</em></button>
    <button class="mode-btn" data-mode="records">维修记录 <em id="recCount">0</em></button>
  </nav>
</header>

<div class="layout">

  <aside class="sidebar">
    <div class="side-block">
      <div class="side-title">
        <span>设备分类</span>
        <button id="collapseAll" class="mini-btn" type="button">折叠</button>
      </div>
      <div id="catTree" class="cat-tree"></div>
    </div>

    <div class="side-block">
      <div class="side-title"><span>筛选</span></div>
      <div class="filters" id="levelFilters">
        <label class="chip"><input type="checkbox" value="self" checked><span class="dot dot-self"></span>可自修</label>
        <label class="chip"><input type="checkbox" value="mixed" checked><span class="dot dot-mixed"></span>部分自修</label>
        <label class="chip"><input type="checkbox" value="pro" checked><span class="dot dot-pro"></span>需专业</label>
      </div>
    </div>

    <div class="side-block side-foot">
      <button id="btnExport" class="ghost-btn" type="button">导出备份</button>
      <button id="btnImport" class="ghost-btn" type="button">导入备份</button>
      <input id="importFile" type="file" accept=".json" hidden>
      <div class="stat" id="statLine"></div>
    </div>
  </aside>

  <main class="main">

    <!-- 浏览 / 搜索 / 收藏 列表 -->
    <section id="view-list" class="view">
      <div class="view-head">
        <h1 id="listTitle">全部维修条目</h1>
        <p id="listSub" class="view-sub"></p>
      </div>
      <div id="listArea" class="list-area"></div>
    </section>

    <!-- 详情 -->
    <section id="view-detail" class="view" hidden></section>

    <!-- 图解速查 -->
    <section id="view-diagrams" class="view" hidden>
      <div class="view-head">
        <h1>图解速查</h1>
        <p class="view-sub" id="dgmSub"></p>
      </div>
      <div id="dgmArea"></div>
    </section>

    <!-- 自诊向导 -->
    <section id="view-diag" class="view" hidden>
      <div class="view-head">
        <h1>故障自诊向导</h1>
        <p class="view-sub">三步定位：选设备 → 选现象 → 按顺序排查。不确定就从头顺着往下试。</p>
      </div>

      <div class="diag-steps">
        <div class="diag-step">
          <div class="ds-num">1</div>
          <div class="ds-body">
            <div class="ds-label">是什么设备出问题了？</div>
            <div id="diagDevices" class="chip-row"></div>
          </div>
        </div>
        <div class="diag-step" id="diagStep2">
          <div class="ds-num">2</div>
          <div class="ds-body">
            <div class="ds-label">具体是什么表现？</div>
            <div id="diagSymptoms" class="chip-row"><span class="hint">先选设备</span></div>
          </div>
        </div>
        <div class="diag-step" id="diagStep3">
          <div class="ds-num">3</div>
          <div class="ds-body">
            <div class="ds-label">排查清单</div>
            <div id="diagResult" class="hint">选完现象后，这里会给出按可能性排序的排查顺序。</div>
          </div>
        </div>
      </div>
    </section>

    <!-- 维修记录 -->
    <section id="view-records" class="view" hidden>
      <div class="view-head">
        <h1>我的维修记录</h1>
        <p class="view-sub">修过什么、换了什么、花了多少，记下来以后能翻。</p>
      </div>
      <div class="rec-toolbar">
        <button id="btnNewRecord" class="primary-btn" type="button">+ 新增记录</button>
        <span class="hint" id="recSummary"></span>
      </div>
      <div id="recList" class="list-area"></div>
    </section>

  </main>
</div>

<div id="modalRoot"></div>

<script src="./diagrams.js"></script>
<script src="./data.js"></script>
<script src="./app.js"></script>
</body>
</html>
